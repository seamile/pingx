[package]
name = "pingx"
version = "0.2.1"
edition = "2024"
authors     = ["Seamile <lanhuermao@gmail.com>"]
license     = "MIT"
description = "A efficient network diagnostic tool to replace system ping/ping6, supporting multi-target concurrent probing via ICMP, TCP, and HTTP."
homepage    = "https://github.com/seamile/pingx"
repository  = "https://github.com/seamile/pingx"
keywords    = ["ping", "tcp-ping", "http-ping", "cli", "network"]
categories  = ["command-line-utilities"]
readme      = "README.md"

[[bin]]
name = "pingx"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["rustls"], default-features = false }
anyhow = "1.0.104"
thiserror = "2.0.21"
async-trait = "0.1.92"
futures = "0.3.34"
hickory-resolver = "0.26.3"
socket2 = { version = "0.6.5", features = ["all"] }
bytes = "1.12.1"
colored = "3.1.1"
parking_lot = "0.13.0"
libc = "0.2.191"
ip2location = "0.6.1"
dirs = "7.0.0"
zip = "9.0.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
unicode-width = "0.2.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = 1
codegen-units = 256

# Optimize dependencies even in dev builds.
# This makes build scripts and procedural macros run faster.
[profile.dev.package."*"]
opt-level = 3
